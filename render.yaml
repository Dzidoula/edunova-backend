services:
  - type: web
    name: edunova-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: EDUNOVA_SECRET_KEY
        sync: false
      - key: EDUNOVA_FRONTEND_ORIGIN
        sync: false
      - key: EDUNOVA_DATABASE_URL
        value: sqlite:////opt/render/project/src/edunova.db
